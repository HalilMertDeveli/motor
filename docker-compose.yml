# MOTOR web application, built from this repository (never the upstream
# Smartstore image). Add exactly one database file:
#
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build
#
# or set COMPOSE_FILE in .env (see .env.example). Without a database file
# the store can only be installed with SQLite.
# Setup and operations: docs/motor/docker.md

name: ${MOTOR_PROJECT_NAME:-motor}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MOTOR_REVISION: ${MOTOR_REVISION:-unknown}
    image: ${MOTOR_IMAGE:-motor-web}:${MOTOR_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      # Loopback by default: put a TLS reverse proxy in front for public traffic.
      - "${MOTOR_HTTP_BIND:-127.0.0.1}:${MOTOR_HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: ${MOTOR_TZ:-Europe/Istanbul}
    volumes:
      # Settings.txt (connection string), media, data protection keys, SQLite files
      - tenants:/app/App_Data/Tenants
      - logs:/app/App_Data/Logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s

volumes:
  tenants:
  logs:
