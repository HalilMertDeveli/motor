name: Delete old workflow runs
on:
  # MOTOR: manual only. The upstream monthly schedule is removed so runs are never deleted unattended.
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days.'
        required: true
        default: '30'
      minimum_runs:
        description: 'The minimum runs to keep for each workflow.'
        required: true
        default: '6'
      delete_workflow_pattern:
        description: 'The name or filename of the workflow. if not set then it will target all workflows.'
        required: false
      delete_workflow_by_state_pattern:
        description: 'Remove workflow by state: active, deleted, disabled_fork, disabled_inactivity, disabled_manually'
        required: true
        default: "All"
        type: choice
        options:
          - "All"
          - active
          - deleted
          - disabled_inactivity
          - disabled_manually
      dry_run:
        description: 'Only log actions, do not perform any delete operations.'
        required: false
        default: 'true'

# Deleting runs needs actions: write and nothing else.
permissions:
  actions: write

jobs:
  del_runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ github.event.inputs.days }}
          keep_minimum_runs: ${{ github.event.inputs.minimum_runs }}
          delete_workflow_pattern: ${{ github.event.inputs.delete_workflow_pattern }}
          delete_workflow_by_state_pattern: ${{ github.event.inputs.delete_workflow_by_state_pattern }}
          dry_run: ${{ github.event.inputs.dry_run }}
