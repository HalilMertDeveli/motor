name: MOTOR release image

# Builds the MOTOR Docker image from this repository and pushes it to the
# repository-owned GHCR package. Runs only for the stable branch and manual
# dispatch: feature and preview PRs never produce a release image, and nothing
# here deploys. Deployment is a separate, approved step (motor-deploy.yml).
on:
  push:
    branches: [motor]
  workflow_dispatch:

concurrency:
  group: motor-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/motor-web" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            MOTOR_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
            ${{ steps.meta.outputs.image }}:motor
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Image: \`${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on the VPS with: \`deploy/vps/scripts/deploy.sh sha-${{ steps.meta.outputs.short }}\`" >> "$GITHUB_STEP_SUMMARY"
