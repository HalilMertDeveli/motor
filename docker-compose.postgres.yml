# PostgreSQL database for MOTOR. Use together with docker-compose.yml.
# In the installer: server "db", database/user/password from .env.

services:
  web:
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:${MOTOR_POSTGRES_TAG:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MOTOR_DB_NAME:-motor}
      POSTGRES_USER: ${MOTOR_DB_USER:-motor}
      POSTGRES_PASSWORD: ${MOTOR_DB_PASSWORD:?Set MOTOR_DB_PASSWORD in .env}
    # No host port: only the web container reaches the database.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
